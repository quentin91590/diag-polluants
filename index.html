<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e4184">
<title>Diagnostic polluants</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=18">
<script>
/* Secours : si l'appli ne démarre pas, afficher la cause et proposer de réparer */
(function () {
  var errs = [];
  function show(msg) {
    if (window.__appOk) return;
    var d = document.getElementById('rescue');
    if (!d) { d = document.createElement('div'); d.id = 'rescue'; document.body.appendChild(d); }
    d.style.cssText = 'position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:24px;background:#f6f6f9;font:16px Poppins,system-ui,sans-serif;text-align:center';
    d.innerHTML = '<div><p style="font-weight:600;font-size:18px;margin:0 0 8px">L’appli n’a pas démarré</p><p style="color:#6b6979;margin:0 0 12px">' + msg + '</p><p style="color:#d1182b;font-size:13px;margin:0 0 16px;word-break:break-word">' + errs.slice(0, 3).join('<br>') + '</p><button id="fix" style="min-height:48px;padding:0 22px;border:0;border-radius:14px;background:#4e4184;color:#fff;font:600 16px Poppins,system-ui,sans-serif">Réparer</button><p style="color:#6b6979;font-size:13px;margin:14px 0 0">Vos mandats sont conservés.</p></div>';
    document.getElementById('fix').onclick = function () {
      var p = [];
      try { p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      try { p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      Promise.all(p).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
    };
  }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  window.addEventListener('error', function (e) { if (e.message) { errs.push(esc(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''))); setTimeout(function () { show('Erreur au démarrage.'); }, 300); } });
  window.addEventListener('unhandledrejection', function (e) { errs.push(esc(e.reason && e.reason.message || e.reason)); setTimeout(function () { show('Erreur au démarrage.'); }, 300); });
  setTimeout(function () { show('Le démarrage prend trop de temps.'); }, 6000);
})();
</script>
<script src="js/vendor/qrcode.js?v=18" defer></script>
<script type="module" src="js/app.js?v=18"></script>
</head>
<body>
<header class="bar" id="bar">
  <button class="ic" id="back" type="button" aria-label="Retour"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="bt"><b id="title">Diagnostic polluants</b><span id="subtitle">Prototype pour Novacity</span></div>
  <span class="net" id="net" hidden>Hors ligne</span>
</header>
<main id="view" class="view"><p class="note">Chargement…</p></main>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ar-ov" id="ar-ov" hidden>
  <svg class="ar-svg" id="ar-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="ar-dots" id="ar-dots"></div>
  <div class="ar-ret" id="ar-ret"><i></i></div>
  <div class="ar-top"><b id="ar-mode">Mesure</b><span id="ar-msg">Bougez doucement le téléphone pour détecter les surfaces.</span></div>
  <div class="ar-read" id="ar-read"></div>
  <div class="ar-bot">
    <button type="button" class="ar-b" id="ar-cancel">Annuler</button>
    <button type="button" class="ar-b" id="ar-undo">Retour</button>
    <button type="button" class="ar-b pri" id="ar-pt">Point</button>
    <button type="button" class="ar-b ok" id="ar-ok" disabled>Valider</button>
  </div>
</div>
<noscript>Cette application a besoin de JavaScript.</noscript>
</body>
</html>
